name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 is what composer.json requires and what nothing else exercises; 8.5 is what the
        # package is developed on. A gate that only ran one of them would miss half its job.
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # From the committed lockfile: this resolves nothing, which is what makes it reproducible.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: make on-push
