name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 is what composer.json requires and what nothing else exercises; 8.5 is what the
        # package is developed on. A gate that only ran one of them would miss half its job.
        php: ['8.4', '8.5']

    steps:
      # Pinned by commit, not by tag: a tag can be moved onto code nobody reviewed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # From the committed lockfile: this resolves nothing, which is what makes it reproducible.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: make on-push
